[project]
name = "brain-api-quickstart"
version = "0.1.0"
description = "Reference Python integration for the Revmachina Brain API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
